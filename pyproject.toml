[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretdrop"
version = "0.2.0"
description = "Hand a secret to a machine over your tailnet, once."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
secretdrop = "secretdrop.cli:main"

[tool.setuptools]
packages = ["secretdrop"]
