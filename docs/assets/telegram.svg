    <path d="M120,418 H362 A18,18 0 0 1 380,436 V462 C380,471 383,474.5 386.5,475.7 C381.5,476.7 376,475.4 372,473.4 C369,475.4 366,476 362,476 H120 A18,18 0 0 1 102,458 V436 A18,18 0 0 1 120,418 Z" fill="#e1fec6" filter="url(#bshadow)"/>
