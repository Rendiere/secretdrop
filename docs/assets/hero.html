<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>secretdrop hero</title>
<style>
  :root {
    --bg: #f3f5f7;
    --ink: #1f2328;
    --muted: #59636e;
    --blue: #1d6fdc;
    --s: 0.5641;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .brand {
    position: absolute; left: 36px; top: 30px;
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
  }
  .brand svg { width: 26px; height: 26px; display: block; }
  .phone {
    position: absolute; top: 44px;
    width: 238px; height: 494px;
    padding: 9px;
    border-radius: 46px;
    background: #1b1b1d;
    box-shadow:
      inset 0 0 0 1px #3a3a3d,
      0 1px 2px rgba(16, 24, 40, 0.06),
      0 18px 40px -12px rgba(16, 24, 40, 0.22);
  }
  .phone.left { left: 252px; }
  .phone.right { left: 710px; }
  .screen {
    position: relative;
    width: 220px; height: 476px;
    border-radius: 37px;
    overflow: hidden;
    background: #fff;
  }
  .canvas {
    position: absolute; left: 0; top: 0;
    width: 390px; height: 844px;
    transform: scale(var(--s));
    transform-origin: 0 0;
  }
  .canvas > img { position: absolute; left: 0; width: 390px; display: block; }
  .island {
    position: absolute; left: 132px; top: 11px;
    width: 126px; height: 36px; border-radius: 18px;
    background: #000;
  }
  .statusbar { position: absolute; left: 0; top: 0; width: 390px; height: 54px; background: #fff; }
  .safari {
    position: absolute; left: 0; bottom: 0; width: 390px; height: 92px;
    background: rgba(248, 248, 248, 0.96);
    border-top: 0.6px solid #c6c6c8;
  }
  .safari .pill {
    position: absolute; left: 16px; right: 16px; top: 10px; height: 44px;
    border-radius: 14px; background: #e9e9eb;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #000; letter-spacing: -0.2px;
  }
  .safari .home {
    position: absolute; left: 128px; bottom: 8px;
    width: 134px; height: 5px; border-radius: 3px; background: #000;
  }
  .caption {
    position: absolute; top: 560px; width: 238px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 17px; font-weight: 600; letter-spacing: -0.2px;
  }
  .caption.left { left: 252px; }
  .caption.right { left: 710px; }
  .caption .n {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .connector { position: absolute; left: 0; top: 0; width: 1200px; height: 627px; pointer-events: none; }
  .tag {
    position: absolute; left: 600px; top: 324px;
    transform: translate(-50%, -50%);
    padding: 5px 11px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #dde2e8;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .tag svg { width: 11px; height: 11px; display: block; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#1d6fdc" d="M11.2 2.57A1 1 0 0 1 12.8 2.57L18 9.5A7.5 7.5 0 1 1 6 9.5Z"/>
      <path fill="#ffffff" d="M12 10.3a2.5 2.5 0 0 1 1.2 4.69L13.8 18.5h-3.6l.6-3.51A2.5 2.5 0 0 1 12 10.3Z"/>
    </svg>
    secretdrop
  </div>

  <svg class="connector" viewBox="0 0 1200 627" aria-hidden="true">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M1 1.5 L8 5 L1 8.5" fill="none" stroke="#1d6fdc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <circle cx="503" cy="373" r="3" fill="#1d6fdc"/>
    <path d="M503 373 C 600 373, 600 276, 694 276" fill="none" stroke="#1d6fdc" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#head)"/>
  </svg>
  <div class="tag">
    <svg viewBox="0 0 12 12"><rect x="2" y="5.2" width="8" height="5.8" rx="1.4" fill="#59636e"/><path d="M3.9 5.2V3.8a2.1 2.1 0 0 1 4.2 0v1.4" fill="none" stroke="#59636e" stroke-width="1.2"/></svg>
    one-time link
  </div>

  <div class="phone left">
    <div class="screen">
      <div class="canvas">
        <img src="telegram.svg" alt="Telegram chat where the agent sends a one-time secretdrop link" style="top:0;height:844px">
        <div class="island"></div>
      </div>
    </div>
  </div>

  <div class="phone right">
    <div class="screen">
      <div class="canvas">
        <img src="drop-light.png" alt="The secretdrop page with a field to paste the secret" style="top:54px;height:844px">
        <div class="statusbar">
          <svg width="390" height="54" viewBox="0 0 390 54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
            <text x="56" y="37" font-size="17" font-weight="600" fill="#000" text-anchor="middle" letter-spacing="-0.2">9:41</text>
            <g fill="#000">
              <rect x="292" y="29.5" width="3.2" height="4.5" rx="0.8"/>
              <rect x="297" y="27.5" width="3.2" height="6.5" rx="0.8"/>
              <rect x="302" y="25" width="3.2" height="9" rx="0.8"/>
              <rect x="307" y="22.5" width="3.2" height="11.5" rx="0.8"/>
              <path d="M323.5 24.6a10.6 10.6 0 0 1 14.6 0l-1.5 1.6a8.4 8.4 0 0 0-11.6 0z"/>
              <path d="M326.4 27.6a6.4 6.4 0 0 1 8.8 0l-1.5 1.6a4.2 4.2 0 0 0-5.8 0z"/>
              <path d="M329.3 30.6a2.2 2.2 0 0 1 3 0l-1.5 1.7z"/>
              <rect x="345" y="22.5" width="24" height="12" rx="3.6" fill="none" stroke="#000" stroke-opacity="0.38" stroke-width="1"/>
              <rect x="347" y="24.5" width="20" height="8" rx="2"/>
              <path d="M370.6 26.6v3.8a2 2 0 0 0 0-3.8z" fill-opacity="0.4"/>
            </g>
          </svg>
        </div>
        <div class="safari">
          <div class="pill">100.101.7.42</div>
          <div class="home"></div>
        </div>
        <div class="island"></div>
      </div>
    </div>
  </div>

  <div class="caption left"><span class="n">1</span>Your agent asks</div>
  <div class="caption right"><span class="n">2</span>You drop it</div>
</body>
</html>
